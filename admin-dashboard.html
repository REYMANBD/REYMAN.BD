<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REYMAN.BD Admin Dashboard</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}


header{

    background:#111;
    color:white;
    padding:20px;

}


main{

    padding:20px;

}


.card{

    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;

}


input,textarea,select{

    width:100%;
    padding:10px;
    margin:8px 0;

}


button{

    padding:10px 15px;
    background:#111;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;

}


.product{

    border:1px solid #ddd;
    padding:15px;
    margin-top:10px;
    border-radius:10px;

}


</style>


</head>


<body>


<header>

<h1>
REYMAN.BD Admin Dashboard
</h1>

</header>



<main>


<div class="card">

<h2>
Dashboard
</h2>

<p>
Total Products:
<span id="count">
0
</span>
</p>

</div>



<div class="card">


<h2>
Add Product
</h2>


<input id="name" placeholder="Product Name">


<textarea id="description"
placeholder="Description">
</textarea>


<input id="price"
type="number"
placeholder="Price">


<input id="oldPrice"
type="number"
placeholder="Old Price">


<input id="category"
placeholder="Category">


<input id="stock"
type="number"
placeholder="Stock Quantity">


<input id="image"
placeholder="Image URL">


<button onclick="addProduct()">

Save Product

</button>



</div>





<div class="card">


<h2>
Products
</h2>


<div id="productList">

Loading...

</div>


</div>



</main>




<script>


// ==========================
// SUPABASE CONNECTION
// ==========================


const SUPABASE_URL =
"https://yrrhcxhjqttyjwdelkyb.supabase.co";


const SUPABASE_KEY =

"sb_publishable_7VPqTiccK6qEycDOMSprvA_AZ2ncp8k";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

// ==========================
// LOAD PRODUCTS
// ==========================


async function loadProducts(){
let products = [];

const {data,error}=

await supabaseClient
.from("products")
.select("*")
.order("id",{ascending:false});



if(error){

console.log(error);
return;

}

 products = data;


document.getElementById("count")
.innerText=data.length;



let html="";



data.forEach(product=>{


html+=`

<div class="product">


<h3>
${product.name}
</h3>


<p>
${product.description || ""}
</p>


<p>
Price: ${product.price}
</p>


<p>
Old Price: ${product.old_price || ""}
</p>


<p>
Category: ${product.category || ""}
</p>


<p>
Stock: ${product.stock || ""}
</p>



<button onclick="editProduct('${product.id}')">

Edit

</button>



<button onclick="deleteProduct('${product.id}')">

Delete

</button>



</div>


`;


});



document.getElementById("productList")
.innerHTML=html;


}





// ==========================
// ADD PRODUCT
// ==========================


async function addProduct(){


const product={


name:
document.getElementById("name").value,


description:
document.getElementById("description").value,


price:
Number(document.getElementById("price").value),


old_price:
Number(document.getElementById("oldPrice").value),


category:
document.getElementById("category").value,


stock:
Number(document.getElementById("stock").value),


image:
document.getElementById("image").value


};



const {error}=

await supabaseClient
.from("products")
.insert(product);



if(error){

alert(error.message);
return;

}



alert("Product Added");


loadProducts();


}





// ==========================
// EDIT
// ==========================


function editProduct(id){

    const product =
    products.find(
    p => p.id == id
    );


    if(!product){

        alert("Product not found");

        return;

    }


    document.getElementById("name").value =
    product.name;


    document.getElementById("description").value =
    product.description;


    document.getElementById("price").value =
    product.price;


    document.getElementById("oldPrice").value =
    product.old_price;


    document.getElementById("category").value =
    product.category;


    document.getElementById("stock").value =
    product.stock;


}




// ==========================
// DELETE
// ==========================


async function deleteProduct(id){


let ok =
confirm(
"Delete Product?"
);



if(!ok)
return;


const {data,error}=

await supabaseClient
.from("products")
.delete()
.eq("id",id)
.select();




if(error){

alert(error.message);
return;

}



if(data.length > 0){

    alert("Deleted successfully");

}else{

    alert("No product was deleted");

}


loadProducts();


}




loadProducts();



</script>



</body>

</html>
