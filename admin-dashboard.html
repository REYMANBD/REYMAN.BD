<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REYMAN.BD Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
        }

        main {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>REYMAN.BD Admin Dashboard</h1>
</header>

<main>

    <div class="card">
        <h2>Products</h2>
        <button onclick="showAddProduct()">
    Add Product
</button>
        <p id="productCount">Loading products...</p>

        <button onclick="loadProducts()">
            Refresh Products
  
        </button>
        <div id="addProductForm" style="display:none; margin-top:20px;">

    <input id="productName" type="text" placeholder="Product name">
    <br><br>

    <input id="productPrice" type="number" placeholder="Price">
    <br><br>

    <input id="productOldPrice" type="number" placeholder="Old price">
    <br><br>

    <input id="productCategory" type="text" placeholder="Category">
    <br><br>

    <textarea id="productDescription" placeholder="Description"></textarea>
    <br><br>

    <input id="productStock" type="number" placeholder="Stock">
    <br><br>

    <button onclick="addProduct()">
        Save Product
    </button>

</div>
    </div>

    <div class="card">
        <h2>Orders</h2>
        <p>Order management will be added next.</p>
    </div>

    <div class="card">
        <h2>Settings</h2>
        <p>Website settings will be added next.</p>
    </div>

</main>

<script>
    const SUPABASE_URL = "https://yrrhcxhjqttyjwdelkyb.supabase.co";

    const SUPABASE_KEY = "sb_publishable_7VPqTiccK6qEycDOMSprvA_AZ2ncp8k";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    function showAddProduct() {
        document.getElementById("addProductForm").style.display = "block";
    }


    async function loadProducts() {

        const { data, error } =
            await supabaseClient
                .from("products")
                .select("*");

        if (error) {
            document.getElementById("productCount").innerText =
                "Error loading products";
            console.error(error);
            return;
        }

        document.getElementById("productCount").innerText =
            data.length + " product(s) found";
    }


    async function addProduct() {

        const name =
            document.getElementById("productName").value;

        const price =
            document.getElementById("productPrice").value;

        const old_price =
            document.getElementById("productOldPrice").value;

        const category =
            document.getElementById("productCategory").value;

        const description =
            document.getElementById("productDescription").value;

        const stock =
            document.getElementById("productStock").value;


        const { error } =
            await supabaseClient
                .from("products")
                .insert([
                    {
                        name: name,
                        price: price,
                      Old_price: old_price,
                        category: category,
                        description: description,
                        stock: stock,
                        featured: false
                    }
                ]);


        if (error) {
            alert("Product add failed: " + error.message);
            return;
        }


        alert("Product added successfully!");

        document.getElementById("addProductForm").style.display = "none";

        loadProducts();
    }


    loadProducts();

</script>

</body>
</html>
