                <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REYMAN.BD Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
        }

        main {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            margin-bottom: 5px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 100px;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        #addProductForm {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>REYMAN.BD Admin Dashboard</h1>
</header>

<main>

    <!-- PRODUCTS -->

    <div class="card">

        <h2>Products</h2>

        <button onclick="showAddProduct()">
            Add Product
        </button>

        <p id="productCount">
            Loading products...
        </p>

        <button onclick="loadProducts()">
            Refresh Products
        </button>


        <!-- ADD PRODUCT FORM -->

        <div id="addProductForm" style="display:none;">

            <h3>Add New Product</h3>

            <input
                id="productName"
                type="text"
                placeholder="Product name"
            >

            <br><br>

            <input
                id="productImage"
                type="file"
                accept="image/*"
            >

            <br><br>

      input
                id="productPrice"
                type="number"
                placeholder="Price"
            >

            <br><br>

            <input
                id="productOldPrice"
                type="number"
                placeholder="Old price"
            >

            <br><br>

            <input
                id="productCategory"
                type="text"
                placeholder="Category"
            >

            <br><br>

            <textarea
                id="productDescription"
                placeholder="Description"
            ></textarea>

            <br><br>

            <input
                id="productStock"
                type="number"
                placeholder="Stock"
            >

            <br><br>

            <button onclick="addProduct()">
                Save Product
            </button>

        </div>

    </div>


    <!-- ORDERS -->

    <div class="card">

        <h2>Orders</h2>

        <p>
            Order management will be added next.
        </p>

    </div>


    <!-- SETTINGS -->

    <div class="card">

        <h2>Settings</h2>

        <p>
            Website settings will be added next.
        </p>

    </div>

</main>


<script>

    /* =========================
       SUPABASE CONNECTION
    ========================= */

    const SUPABASE_URL =
        "https://yrrhcxhjqttyjwdelkyb.supabase.co";

    const SUPABASE_KEY =
        
"sb_publishable_7VPqTiccK6qEycDOMSprvA_AZ2ncp8k";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       SHOW ADD PRODUCT FORM
    ========================= */

    function showAddProduct() {

        document.getElementById(
            "addProductForm"
        ).style.display = "block";

    }


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

        const { data, error } =
            await supabaseClient
                .from("products")
                .select("*");


        if (error) {

            document.getElementById(
                "productCount"
            ).innerText =
                "Error loading products";

            console.error(error);

            return;
        }


        document.getElementById(
            "productCount"
        ).innerText =
            data.length + " product(s) found";

    }


    /* =========================
       ADD PRODUCT
    ========================= */

    async function addProduct() {

        const name =
            document.getElementById(
                "productName"
            ).value.trim();


        const price =
            document.getElementById(
                "productPrice"
            ).value;


        const old_price =
            document.getElementById(
                "productOldPrice"
            ).value;


        const category =
            document.getElementById(
                "productCategory"
            ).value.trim();


        const description =
            document.getElementById(
                "productDescription"
            ).value.trim();


        const stock =
            document.getElementById(
                "productStock"
            ).value;


        const imageFile =
            document.getElementById(
                "productImage"
            ).files[0];


        /* CHECK IMAGE */

        if (!imageFile) {

            alert(
                "Please select a product image."
            );

            return;
        }


        /* CHECK REQUIRED FIELDS */

        if (!name || !price || !category) {

            alert(
                "Please fill Product Name, Price and Category."
            );

            return;
        }


        /* =========================
           UPLOAD IMAGE
        ========================= */

        const fileName =
            Date.now() + "-" + imageFile.name;


        const { error: uploadError } =
            await supabaseClient
                .storage
                .from("Product-images")
                .upload(
                    fileName,
                    imageFile
                );


        if (uploadError) {

            alert(
                "Image upload failed: " +
                uploadError.message
            );

            console.error(uploadError);

            return;
        }


        /* =========================
           GET PUBLIC IMAGE URL
        ========================= */

        const { data: publicUrlData } =
            supabaseClient
                .storage
                .from("Product-images")
                .getPublicUrl(
                    fileName
                );


        const imagePath =
            publicUrlData.publicUrl;


        /* =========================
           INSERT PRODUCT
        ========================= */

        const { error } =
            await supabaseClient
                .from("products")
                .insert([
                    {
                        name: name,
                        price: price,
                        Old_price: old_price,
                        category: category,
                        description: description,
                        stock: stock,
                        featured: false,
                        image_path: imagePath
                    }
                ]);


        /* INSERT ERROR */

        if (error) {

            alert(
                "Product add failed: " +
                error.message
            );

            console.error(error);

            return;
        }


        /* SUCCESS */

        alert(
            "Product added successfully!"
        );


        /* HIDE FORM */

        document.getElementById(
            "addProductForm"
        ).style.display = "none";


        /* CLEAR FORM */

        document.getElementById(
            "productName"
        ).value = "";

        document.getElementById(
            "productImage"
        ).value = "";

        document.getElementById(
            "productPrice"
        ).value = "";

        document.getElementById(
            "productOldPrice"
        ).value = "";

        document.getElementById(
            "productCategory"
        ).value = "";

        document.getElementById(
            "productDescription"
        ).value = "";

        document.getElementById(
            "productStock"
        ).value = "";


        /* REFRESH */

        loadProducts();

    }


    /* =========================
       INITIAL LOAD
    ========================= */

    loadProducts();

</script>

</body>

</html>
