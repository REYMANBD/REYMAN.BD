      <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REYMAN.BD Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
        }

        main {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 100px;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            margin: 5px 0;
        }

        #addProductForm {
            display: none;
            margin-top: 20px;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>REYMAN.BD Admin Dashboard</h1>
</header>

<main>

    <!-- PRODUCTS -->

    <div class="card">

        <h2>Products</h2>

        <p id="productCount">
            Loading products...
        </p>

        <button onclick="loadProducts()">
            Refresh Products
        </button>

        <br>

        <button onclick="showAddProduct()">
            Add Product
        </button>


        <!-- ADD PRODUCT FORM -->

        <div id="addProductForm">

            <h3>Add New Product</h3>

            <input
                id="productName"
                type="text"
                placeholder="Product name"
            >

            <br><br>

            <input
                id="productImage"
                type="file"
                accept="image/*"
            >

            <br><br>

            <input
                id="productPrice"
                type="number"
                placeholder="Price"
            >
               <br><br>
            <br><br>

            <input
                id="productOldPrice"
                type="number"
                placeholder="Old price"
            >
        <br><br>

            <input
                id="productCategory"
                type="text"
                placeholder="Category"
            >

            <br><br>

            <textarea
                id="productDescription"
                placeholder="Description"
            ></textarea>

            <br><br>

            <input
                id="productStock"
                type="number"
                placeholder="Stock"
            >

            <br><br>

            <button onclick="addProduct()">
                Save Product
            </button>

            <button onclick="hideAddProduct()">
                Cancel
            </button>

            <p id="status"></p>

        </div>

    </div>


    <!-- ORDERS -->

    <div class="card">

        <h2>Orders</h2>

        <p>
            Order management will be added next.
        </p>

    </div>


    <!-- SETTINGS -->

    <div class="card">

        <h2>Settings</h2>

        <p>
            Website settings will be added next.
        </p>

    </div>

</main>


<script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
        "https://yrrhcxhjqttyjwdelkyb.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_7VPqTiccK6qEycDOMSprvA_AZ2ncp8k";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       SHOW FORM
    ========================= */

    function showAddProduct() {

        document.getElementById(
            "addProductForm"
        ).style.display = "block";

    }


    /* =========================
       HIDE FORM
    ========================= */

    function hideAddProduct() {

        document.getElementById(
            "addProductForm"
        ).style.display = "none";

    }


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

        const productCount =
            document.getElementById(
                "productCount"
            );

        productCount.innerText =
            "Loading products...";


        const { data, error } =
            await supabaseClient
                .from("products")
                .select("*");


        if (error) {

            console.error(
                "Product loading error:",
                error
            );

            productCount.innerText =
                "Error loading products";

            return;
        }


        productCount.innerText =
            data.length +
            " product(s) found";

    }


    /* =========================
       ADD PRODUCT
    ========================= */

    async function addProduct() {

        const status =
            document.getElementById(
                "status"
            );


        const name =
            document.getElementById(
                "productName"
            ).value.trim();


        const price =
            document.getElementById(
                "productPrice"
            ).value;


        const oldPrice =
            document.getElementById(
                "productOldPrice"
            ).value;


        const category =
            document.getElementById(
                "productCategory"
            ).value.trim();


        const description =
            document.getElementById(
                "productDescription"
            ).value.trim();


        const stock =
            document.getElementById(
                "productStock"
            ).value;


        const imageFile =
            document.getElementById(
                "productImage"
            ).files[0];


        /* =========================
           VALIDATION
        ========================= */

        if (!name) {

            alert("Enter product name.");

            return;
        }


        if (!price) {

            alert("Enter product price.");

            return;
        }


        if (!category) {

            alert("Enter product category.");

            return;
        }


        if (!imageFile) {

            alert("Please select a product image.");

            return;
        }


        status.innerText =
            "Uploading image...";


        /* =========================
           IMAGE FILE NAME
        ========================= */

        const safeFileName =
            imageFile.name
                .replace(/[^a-zA-Z0-9._-]/g, "-");


        const fileName =
            Date.now() +
            "-" +
            safeFileName;


        /* =========================
           UPLOAD IMAGE
        ========================= */

        const {
            error: uploadError
        } =
            await supabaseClient
                .storage
                .from("Product-images")
                .upload(
                    fileName,
                    imageFile
                );


        if (uploadError) {

            console.error(
                "Image upload error:",
                uploadError
            );

            status.innerText =
                "";

            alert(
                "Image upload failed: " +
                uploadError.message
            );

            return;
        }


        /* =========================
           PUBLIC IMAGE URL
        ========================= */

        const {
            data: publicUrlData
        } =
            supabaseClient
                .storage
                .from("Product-images")
                .getPublicUrl(
                    fileName
                );


        const imagePath =
            publicUrlData.publicUrl;


        /* =========================
           SAVE PRODUCT
        ========================= */

        status.innerText =
            "Saving product...";


        const {
            error: productError
        } =
            await supabaseClient
                .from("products")
                .insert([
                    {
                        name: name,
                        price: Number(price),
                        Old_price: oldPrice
                            ? Number(oldPrice)
                            : null,
                        category: category,
                        description: description,
                        stock: stock
                            ? Number(stock)
                            : 0,
                        featured: false,
                        image_path: imagePath
                    }
                ]);


        if (productError) {

            console.error(
                "Product insert error:",
                productError
            );

            status.innerText =
                "";

            alert(
                "Product add failed: " +
                productError.message
            );

            return;
        }


        /* =========================
           SUCCESS
        ========================= */

        status.innerText =
            "Product added successfully!";


        alert(
            "Product added successfully!"
        );


        /* =========================
           CLEAR FORM
        ========================= */

        document.getElementById(
            "productName"
        ).value = "";

        document.getElementById(
            "productImage"
        ).value = "";

        document.getElementById(
            "productPrice"
        ).value = "";

        document.getElementById(
            "productOldPrice"
        ).value = "";

        document.getElementById(
            "productCategory"
        ).value = "";

        document.getElementById(
            "productDescription"
        ).value = "";

        document.getElementById(
            "productStock"
        ).value = "";


        /* =========================
           HIDE FORM
        ========================= */

        hideAddProduct();


        /* =========================
           REFRESH COUNT
        ========================= */

        loadProducts();

    }


    /* =========================
       START
    ========================= */

    loadProducts();

</script>

</body>

</html>
