l <!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REYMAN.BD Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #111;

    padding: 20px;
}

main {

}

</style>

</head>


<body>


<header>

<h1>
REYMAN.BD Admin Dashboard
</h1>

</header>


<main>


<div class="card">

<h2>
Dashboard
</h2>

<p>
Welcome Admin
</p>

</div>
<div class="card">

<h2>
Products
</h2>

<p id="productCount">
Loading products...
</p>

<div id="productList"></div>
<button onclick="showAddProduct()">
Add Product
</button>


<div id="addProductForm" style="display:none;">

<h3>Add New Product</h3>


<input id="productName" placeholder="Product name">

<br><br>

<input id="productPrice" type="number" placeholder="Price">
<br><br>

<input 
id="productOldPrice" 
type="number" 
placeholder="Old Price">
<br><br>
<br><br>

<input 
id="productCategory" 
type="text" 
placeholder="Category">
<input id="productImage" type="file" accept="image/*">

<br><br>

<button onclick="addProduct()">
Save Product
</button>


<button onclick="hideAddProduct()">
Cancel
</button>


</div>
</div>

</main>

<script>

const SUPABASE_URL =
"https://yrrhcxhjqttyjwdelkyb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7VPqTiccK6qEycDOMSprvA_AZ2ncp8k";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


console.log("Supabase Connected");
async function loadProducts() {

    const productCount =
        document.getElementById("productCount");

    const productList =
        document.getElementById("productList");


    productCount.innerText =
        "Loading products...";


    const { data, error } =
        await supabaseClient
            .from("products")
            .select("*");


    if (error) {

        productCount.innerText =
            "Error loading products";

        console.log(error);

        return;
    }


    productCount.innerText =
        data.length + " product(s) found";


    productList.innerHTML = "";


    data.forEach(product => {

        productList.innerHTML += `

        <div style="
        border:1px solid #ddd;
        padding:15px;
        margin-top:10px;
        border-radius:10px;
        ">

        <h3>${product.name}</h3>

        <p>
        Price: ${product.price}
        </p>
<button>
Edit
</button>
<button onclick="deleteProduct('${product.id}')">
Delete
</button>

        </div>

        `;

    });

}
  async function deleteProduct(id) {

    const confirmDelete =
        confirm("Delete this product?");

    if (!confirmDelete) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        alert(error.message);

        return;
    }


    alert("Product deleted");

    loadProducts();

}  
loadProducts();
function showAddProduct() {

    document.getElementById(
        "addProductForm"
    ).style.display = "block";

}


function hideAddProduct() {

    document.getElementById(
        "addProductForm"
    ).style.display = "none";

}
async function addProduct() {

    const name =
        document.getElementById("productName").value;

    const price =
        document.getElementById("productPrice").value;
 const oldPrice =
    document.getElementById("productOldPrice").value;

const category =
    document.getElementById("productCategory").value;
    const { error } =
        await supabaseClient
            .from("products")
.insert([
    {
    name: name,
    price: Number(price),
    Old_price: oldPrice
        ? Number(oldPrice)
        : 0,
    category: category
}
]);


    if (error) {

    alert(
        error.message
    );

    console.log(error);

    return;
}


    alert(
        "Product added successfully"
    );


    hideAddProduct();

    loadProducts();

}
loadProducts();
</script>
</body>

</html>
