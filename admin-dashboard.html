<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REYMAN.BD Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
        }

        main {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>REYMAN.BD Admin Dashboard</h1>
</header>

<main>

    <div class="card">
        <h2>Products</h2>
        <p id="productCount">Loading products...</p>

        <button onclick="loadProducts()">
            Refresh Products
        </button>
    </div>

    <div class="card">
        <h2>Orders</h2>
        <p>Order management will be added next.</p>
    </div>

    <div class="card">
        <h2>Settings</h2>
        <p>Website settings will be added next.</p>
    </div>

</main>

<script>
    const SUPABASE_URL = "তোমার Project URL";
    const SUPABASE_KEY = "তোমার Publishable Key";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function loadProducts() {

        const { data, error } =
            await supabaseClient
                .from("products")
                .select("*");

        if (error) {
            document.getElementById("productCount").innerText =
                "Error loading products";
            return;
        }

        document.getElementById("productCount").innerText =
            data.length + " product(s) found";
    }

    loadProducts();
</script>

</body>
</html>
