<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REYMAN.BD | Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            REYMAN.BD
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
            <a href="cart.html">🛒 Cart</a>
        </nav>

    </header>


    <section class="products">

        <h2>Your Shopping Cart</h2>

        <div id="cartItems"></div>

        <h3 id="cartTotal"></h3>

        <button onclick="checkout()">
            Proceed to Checkout
        </button>

    </section>


    <footer>

        <h3>REYMAN.BD</h3>

        <p>Gadgets • Fashion • Accessories</p>

        <p>© 2026 REYMAN.BD — All Rights Reserved</p>

    </footer>


    <script>

        let cart =
            JSON.parse(localStorage.getItem("reymanCart")) || [];


        function displayCart() {

            const container =
                document.getElementById("cartItems");

            const totalElement =
                document.getElementById("cartTotal");


            if (cart.length === 0) {

                container.innerHTML =
                    "<p>Your cart is empty.</p>";

                totalElement.innerHTML = "";

                return;
            }


            let total = 0;

            container.innerHTML = "";


            cart.forEach((product, index) => {

                total += product.price;


                container.innerHTML += `

                    <div class="product-card">

                        <h3>${product.name}</h3>

                        <p>Price: ৳ ${product.price}</p>

                        <button onclick="removeItem(${index})">
                            Remove
                        </button>

                    </div>

                `;

            });


            totalElement.innerHTML =
                "Total: ৳ " + total;
        }


        function removeItem(index) {

            cart.splice(index, 1);

            localStorage.setItem(
                "reymanCart",
                JSON.stringify(cart)
            );

            displayCart();
        }

function checkout() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;
    }

    window.location.href = "checkout.html";
}
        
        


        displayCart();

    </script>

</body>

</html>
